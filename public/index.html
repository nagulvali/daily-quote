<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quote Widget</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .card { padding: 18px 20px; }
    blockquote { margin: 0; font-size: 18px; line-height: 1.4; }
    .meta { margin-top: 10px; opacity: 0.75; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <blockquote id="quote">Loading…</blockquote>
    <div class="meta" id="meta"></div>
  </div>

  <script>
    // "refresh" = new quote on every refresh
    // "daily" = same quote for the day (per browser/device)
    const MODE = "daily";

    const quoteEl = document.getElementById("quote");
    const metaEl = document.getElementById("meta");

    function dayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    async function getQuote() {
      const r = await fetch("/api/quote", { cache: "no-store" });
      if (!r.ok) throw new Error("Failed");
      return await r.json(); // { quote, author, category }
    }

    async function load() {
      try {
        if (MODE === "daily") {
          const key = "dailyQuote:" + dayKey();
          const cached = localStorage.getItem(key);
          if (cached) {
            const q = JSON.parse(cached);
            quoteEl.textContent = `“${q.quote}”`;
            metaEl.textContent = `— ${q.author || "Unknown"} · ${q.category || ""}`;
            return;
          }
          const q = await getQuote();
          localStorage.setItem(key, JSON.stringify(q));
          quoteEl.textContent = `“${q.quote}”`;
          metaEl.textContent = `— ${q.author || "Unknown"} · ${q.category || ""}`;
          return;
        }

        const q = await getQuote();
        quoteEl.textContent = `“${q.quote}”`;
        metaEl.textContent = `— ${q.author || "Unknown"} · ${q.category || ""}`;
      } catch (e) {
        quoteEl.textContent = "Could not load quote.";
        metaEl.textContent = "";
      }
    }

    load();
  </script>
</body>
</html>
